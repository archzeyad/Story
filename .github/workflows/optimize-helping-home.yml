name: Optimize helping-home clean pages
on:
  workflow_dispatch:
  push:
    paths:
      - 'helping-home/source-pages/*.png'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Convert clean pages
        run: |
          mkdir -p helping-home/clean-pages
          for f in helping-home/source-pages/*.png; do
            name=$(basename "$f" .png)
            cwebp -quiet -q 70 -resize 960 640 "$f" -o "helping-home/clean-pages/$name.webp"
          done
      - name: Commit optimized pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helping-home/clean-pages
          if ! git diff --cached --quiet; then
            git commit -m "Optimize helping-home clean story pages"
            git push
          fi
